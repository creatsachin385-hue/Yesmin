name: Build Yesmin AI Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21 & Node 22
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unpack ZIP & Create Capacitor Config
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z" -d .
          done
          mkdir -p www
          FOUND_HTML=$(find . -maxdepth 3 -name "yesmin_ai.html" | head -n 1)
          if [ -n "$FOUND_HTML" ]; then
            cp -f "$FOUND_HTML" www/index.html
          elif [ -f "index.html" ]; then
            cp -f index.html www/index.html
          else
            echo "<h1>Yesmin AI</h1>" > www/index.html
          fi
          printf '%s\n' '{' \
            '  "name": "yesmin-ai",' \
            '  "version": "2.5.0",' \
            '  "private": true,' \
            '  "dependencies": {' \
            '    "@capacitor/android": "6.1.2",' \
            '    "@capacitor/cli": "6.1.2",' \
            '    "@capacitor/core": "6.1.2"' \
            '  }' \
            '}' > package.json
          printf '%s\n' '{' \
            '  "appId": "com.yesmin.ai",' \
            '  "appName": "Yesmin AI",' \
            '  "webDir": "www",' \
            '  "server": {' \
            '    "androidScheme": "https",' \
            '    "cleartext": true' \
            '  }' \
            '}' > capacitor.config.json

      - name: Build Debug APK via Gradle
        run: |
          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
