name: Build Yesmin AI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Extract ZIP if uploaded directly from Phone
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d .
            fi
          done

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Capacitor Android Project
        run: |
          mkdir -p www
          if [ -f "yesmin_ai.html" ]; then cp yesmin_ai.html www/index.html; fi
          npm install
          npx cap add android || npx cap sync android
          npx cap copy android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
