name: Build Yesmin AI Native Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unpack Latest ZIP & Build Native Android APK
        run: |
          NEWEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$NEWEST_ZIP" ]; then
            echo "Extracting newest ZIP: $NEWEST_ZIP"
            unzip -o "$NEWEST_ZIP" -d .
          fi

          mkdir -p www
          echo "Native" > www/index.html
          printf '%s\n' '{' \
            '  "name": "yesmin-ai",' \
            '  "version": "6.0.0",' \
            '  "private": true,' \
            '  "dependencies": {' \
            '    "@capacitor/android": "6.1.2",' \
            '    "@capacitor/cli": "6.1.2",' \
            '    "@capacitor/core": "6.1.2"' \
            '  }' \
            '}' > package.json
          printf '%s\n' '{' \
            '  "appId": "com.yesmin.ai",' \
            '  "appName": "Yesmin AI",' \
            '  "webDir": "www"' \
            '}' > capacitor.config.json
          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android

          # 1. Copy Java classes (MainActivity, YesminAgentService, UiHtmlProvider, and ShizukuProvider)
          mkdir -p android/app/src/main/java/com/yesmin/ai
          mkdir -p android/app/src/main/java/rikka/shizuku
          cp -f MainActivity.java android/app/src/main/java/com/yesmin/ai/MainActivity.java
          cp -f YesminAgentService.java android/app/src/main/java/com/yesmin/ai/YesminAgentService.java
          cp -f UiHtmlProvider.java android/app/src/main/java/com/yesmin/ai/UiHtmlProvider.java
          if [ -f "ShizukuProvider.java" ]; then
            cp -f ShizukuProvider.java android/app/src/main/java/rikka/shizuku/ShizukuProvider.java
          fi

          # 2. Copy AndroidManifest & Accessibility Service XML
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values
          cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f yesmin_accessibility_service.xml android/app/src/main/res/xml/yesmin_accessibility_service.xml
          cp -f strings.xml android/app/src/main/res/values/strings.xml

          # 3. Inject Custom AI App Icon across all mipmap folders
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          if [ -f "app_icon.png" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp -f app_icon.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp -f app_icon.png "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp -f app_icon.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            done
          fi

          # 4. Build APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Pure Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
