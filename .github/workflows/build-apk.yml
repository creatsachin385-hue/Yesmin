name: Build Yesmin AI Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21 (Required by Capacitor 6 Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack ZIP & Prepare Capacitor Project
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z" -d .
          done
          mkdir -p www
          if [ -f "yesmin_ai.html" ]; then
            cp -f yesmin_ai.html www/index.html
          elif [ -f "index.html" ]; then
            cp -f index.html www/index.html
          else
            find . -name "yesmin_ai.html" -exec cp -f {} www/index.html \;
          fi
          cat << 'PKG' > package.json
          {
            "name": "yesmin-ai",
            "version": "2.5.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          PKG
          cat << 'CAP' > capacitor.config.json
          {
            "appId": "com.yesmin.ai",
            "appName": "Yesmin AI",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          CAP

      - name: Add Android Platform & Build Debug APK
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
