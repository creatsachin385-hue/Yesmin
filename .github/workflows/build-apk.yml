name: Build Yesmin AI Native Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unpack ZIP & Build Pure Native Android APK
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -d .
          done
          mkdir -p www
          echo "Native" > www/index.html
          printf '%s\n' '{' \
            '  "name": "yesmin-ai",' \
            '  "version": "3.2.0",' \
            '  "private": true,' \
            '  "dependencies": {' \
            '    "@capacitor/android": "6.1.2",' \
            '    "@capacitor/cli": "6.1.2",' \
            '    "@capacitor/core": "6.1.2"' \
            '  }' \
            '}' > package.json
          printf '%s\n' '{' \
            '  "appId": "com.yesmin.ai",' \
            '  "appName": "Yesmin AI",' \
            '  "webDir": "www"' \
            '}' > capacitor.config.json
          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/yesmin/ai
          cp -f MainActivity.java android/app/src/main/java/com/yesmin/ai/MainActivity.java
          cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Pure Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
